<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <title>Nova Store | Modern E-Commerce Platform</title>

    <meta

    <meta
      property="og:title"
      content="Nova Store | Modern E-Commerce Platform"

    <meta
      property="og:description"

      content="https://ecommerce-platform-ashen-two.vercel.app/nova-store-preview.png"

    <meta

      content="630"

    <meta
      property="og:image:type"
      content="image/png"

    <meta
      property="og:site_name"
      content="Nova Store"

    <meta
      property="og:url"
      content="https://ecommerce-platform-ashen-two.vercel.app/"

      name="twitter:description"

      href="/favicon.png"
    />
